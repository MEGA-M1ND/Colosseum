[package]
name = "agent-wallet"
version = "0.1.0"
edition = "2021"
description = "Spend-limited delegation: give an agent a budget, not your keys"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_wallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = "=0.31.1"

[dev-dependencies]
solana-program-test = "2"
solana-sdk = "2"
spl-token = { version = "8", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
